<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniLMS — Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; }
    .topbar { background: #1e293b; padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #334155; }
    .topbar h1 { font-size: 20px; color: #38bdf8; font-weight: 700; }
    .badge { background: #dc2626; color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .logout { color: #94a3b8; font-size: 13px; text-decoration: none; }
    .logout:hover { color: #38bdf8; }
    .container { max-width: 900px; margin: 40px auto; padding: 0 24px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .panel { background: #1e293b; border-radius: 12px; padding: 28px; border: 1px solid #334155; }
    .panel h2 { font-size: 16px; color: #94a3b8; font-weight: 600; margin-bottom: 20px; text-transform: uppercase; letter-spacing: .05em; }
    input[type=text] { width: 100%; padding: 11px 14px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0; font-size: 14px; outline: none; }
    input:focus { border-color: #38bdf8; }
    .btn { padding: 10px 20px; background: #dc2626; color: white; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 12px; }
    .btn:hover { background: #ef4444; }
    .user-list { list-style: none; }
    .user-list li { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #334155; }
    .user-list li:last-child { border-bottom: none; }
    .username { font-weight: 600; }
    .role { font-size: 12px; padding: 3px 10px; border-radius: 12px; }
    .role.admin { background: #7f1d1d; color: #fca5a5; }
    .role.professor { background: #1e3a5f; color: #93c5fd; }
    .role.student { background: #14532d; color: #86efac; }
    .role.guest { background: #1c1917; color: #a8a29e; }
    .promote-btn { font-size: 11px; color: #38bdf8; cursor: pointer; background: none; border: none; }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>UniLMS</h1>
    <div style="display:flex;align-items:center;gap:16px">
      <span class="badge">🛡️ Admin</span>
      <a class="logout" href="index.html">← Logout</a>
    </div>
  </div>
  <div class="container">
    <div class="grid">
      <div class="panel">
        <h2>Promote to Professor</h2>
        <input type="text" placeholder="Username" id="promoteUser">
        <button class="btn" onclick="promote()">Appoint Professor</button>
        <p id="msg" style="margin-top:12px;font-size:13px;color:#4ade80;display:none"></p>
      </div>
      <div class="panel">
        <h2>User Accounts</h2>
        <ul class="user-list" id="userList"></ul>
      </div>
    </div>
  </div>
  <script>
    const users = { admin:'admin', professor:'professor', student:'student', guest:'guest' };
    function renderList() {
      document.getElementById('userList').innerHTML = Object.entries(users)
        .map(([u,r]) => `<li><span class="username">${u}</span><span class="role ${r}">${r}</span></li>`).join('');
    }
    function promote() {
      const u = document.getElementById('promoteUser').value.trim();
      if (users[u]) { users[u]='professor'; renderList(); document.getElementById('msg').textContent=u+' appointed as Professor'; document.getElementById('msg').style.display='block'; }
      else { document.getElementById('msg').textContent='User not found'; document.getElementById('msg').style.color='#f87171'; document.getElementById('msg').style.display='block'; }
    }
    renderList();
  </script>
</body>
</html>
