<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniLMS — Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #1e293b; border-radius: 16px; padding: 48px 40px; width: 100%; max-width: 400px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
    .logo { text-align: center; margin-bottom: 32px; }
    .logo h1 { font-size: 28px; font-weight: 700; color: #38bdf8; }
    .logo p { color: #94a3b8; font-size: 14px; margin-top: 4px; }
    label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; font-weight: 500; }
    input[type=text], input[type=password] {
      width: 100%; padding: 12px 16px; background: #0f172a; border: 1px solid #334155;
      border-radius: 8px; color: #e2e8f0; font-size: 15px; outline: none; transition: border .2s;
    }
    input:focus { border-color: #38bdf8; }
    .form-group { margin-bottom: 20px; }
    .btn { width: 100%; padding: 13px; background: #38bdf8; color: #0f172a; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; transition: background .2s; margin-top: 8px; }
    .btn:hover { background: #7dd3fc; }
    .divider { text-align: center; color: #475569; font-size: 13px; margin: 24px 0 20px; position: relative; }
    .divider::before, .divider::after { content: ''; position: absolute; top: 50%; width: 40%; height: 1px; background: #334155; }
    .divider::before { left: 0; } .divider::after { right: 0; }
    .roles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .role-btn { padding: 10px; border: 1px solid #334155; background: #0f172a; color: #94a3b8; border-radius: 8px; cursor: pointer; font-size: 13px; text-align: center; text-decoration: none; transition: all .2s; }
    .role-btn:hover { border-color: #38bdf8; color: #38bdf8; }
    .role-btn span { display: block; font-size: 20px; margin-bottom: 4px; }
    .note { text-align: center; color: #475569; font-size: 12px; margin-top: 20px; }
    a { color: #38bdf8; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <h1>UniLMS</h1>
      <p>University Learning Management System</p>
    </div>
    <div class="form-group">
      <label>Username</label>
      <input type="text" placeholder="Enter username" id="uname">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" placeholder="Enter password" id="upass">
    </div>
    <button class="btn" onclick="doLogin()">Sign In</button>

    <div class="divider">or jump to demo</div>

    <div class="roles">
      <a class="role-btn" href="admin.html"><span>🛡️</span>Admin</a>
      <a class="role-btn" href="professor.html"><span>👨‍🏫</span>Professor</a>
      <a class="role-btn" href="student.html"><span>🎓</span>Student</a>
      <a class="role-btn" href="guest.html"><span>👁️</span>Guest</a>
    </div>
    <p class="note">Static demo · <a href="https://github.com/b0gdaan/flask-university-lms">Source on GitHub</a></p>
  </div>
  <script>
    const users = { admin:'adminpass', professor:'professorpass', student:'studentpass', guest:'guestpass' };
    const pages = { admin:'admin.html', professor:'professor.html', student:'student.html', guest:'guest.html' };
    function doLogin() {
      const u = document.getElementById('uname').value.trim();
      const p = document.getElementById('upass').value;
      if (users[u] && users[u] === p) { window.location.href = pages[u]; }
      else { alert('Incorrect username or password'); }
    }
  </script>
</body>
</html>
