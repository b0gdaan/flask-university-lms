<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniLMS — Guest</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .card { background: #1e293b; border-radius: 16px; padding: 48px 40px; max-width: 440px; text-align: center; border: 1px solid #334155; }
    .icon { font-size: 52px; margin-bottom: 20px; }
    h2 { font-size: 22px; color: #e2e8f0; margin-bottom: 10px; }
    p { color: #64748b; font-size: 15px; line-height: 1.6; }
    .btn { display: inline-block; margin-top: 28px; padding: 11px 28px; background: #334155; color: #e2e8f0; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: 600; }
    .btn:hover { background: #475569; }
    .badge { display: inline-block; background: #1c1917; color: #a8a29e; padding: 4px 12px; border-radius: 20px; font-size: 12px; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">👁️ Guest Access</div>
    <div class="icon">🏛️</div>
    <h2>Welcome to UniLMS</h2>
    <p>You have read-only guest access. Please log in with a student or professor account to access course materials and features.</p>
    <a class="btn" href="index.html">← Back to Login</a>
  </div>
</body>
</html>
