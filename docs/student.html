<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniLMS — Student</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; }
    .topbar { background: #1e293b; padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #334155; }
    .topbar h1 { font-size: 20px; color: #38bdf8; font-weight: 700; }
    .badge { background: #166534; color: #86efac; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .logout { color: #94a3b8; font-size: 13px; text-decoration: none; }
    .logout:hover { color: #38bdf8; }
    .container { max-width: 700px; margin: 40px auto; padding: 0 24px; }
    .panel { background: #1e293b; border-radius: 12px; padding: 28px; border: 1px solid #334155; }
    .panel h2 { font-size: 15px; color: #94a3b8; font-weight: 600; margin-bottom: 18px; text-transform: uppercase; letter-spacing: .05em; }
    .material-item { padding: 16px; background: #0f172a; border-radius: 8px; margin-bottom: 10px; border: 1px solid #334155; display: flex; align-items: center; gap: 14px; }
    .material-item .icon { font-size: 22px; }
    .material-item p { font-size: 14px; color: #cbd5e1; }
    .info { color: #475569; font-size: 13px; margin-top: 20px; text-align: center; }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>UniLMS</h1>
    <div style="display:flex;align-items:center;gap:16px">
      <span class="badge">🎓 Student</span>
      <a class="logout" href="index.html">← Logout</a>
    </div>
  </div>
  <div class="container">
    <div class="panel">
      <h2>Course Materials</h2>
      <div class="material-item"><span class="icon">📄</span><p>Introduction to Flask — slides week 1</p></div>
      <div class="material-item"><span class="icon">📝</span><p>Assignment 1: Build a REST API</p></div>
      <p class="info">Read-only access · New materials appear here when uploaded by professor</p>
    </div>
  </div>
</body>
</html>
