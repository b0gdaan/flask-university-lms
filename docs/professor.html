<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniLMS — Professor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; }
    .topbar { background: #1e293b; padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #334155; }
    .topbar h1 { font-size: 20px; color: #38bdf8; font-weight: 700; }
    .badge { background: #1d4ed8; color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .logout { color: #94a3b8; font-size: 13px; text-decoration: none; }
    .logout:hover { color: #38bdf8; }
    .container { max-width: 800px; margin: 40px auto; padding: 0 24px; display: flex; flex-direction: column; gap: 24px; }
    .panel { background: #1e293b; border-radius: 12px; padding: 28px; border: 1px solid #334155; }
    .panel h2 { font-size: 15px; color: #94a3b8; font-weight: 600; margin-bottom: 18px; text-transform: uppercase; letter-spacing: .05em; }
    textarea { width: 100%; padding: 12px 14px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0; font-size: 14px; resize: vertical; outline: none; font-family: inherit; }
    textarea:focus { border-color: #38bdf8; }
    .btn { padding: 10px 24px; background: #1d4ed8; color: white; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 12px; }
    .btn:hover { background: #2563eb; }
    .material-item { display: flex; align-items: flex-start; justify-content: space-between; padding: 14px 16px; background: #0f172a; border-radius: 8px; margin-bottom: 10px; border: 1px solid #334155; }
    .material-item p { font-size: 14px; color: #cbd5e1; flex: 1; }
    .del-btn { background: none; border: none; color: #475569; cursor: pointer; font-size: 16px; padding: 0 0 0 12px; }
    .del-btn:hover { color: #f87171; }
    .empty { color: #475569; font-size: 14px; font-style: italic; }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>UniLMS</h1>
    <div style="display:flex;align-items:center;gap:16px">
      <span class="badge">👨‍🏫 Professor</span>
      <a class="logout" href="index.html">← Logout</a>
    </div>
  </div>
  <div class="container">
    <div class="panel">
      <h2>Upload Material</h2>
      <textarea rows="4" placeholder="Type course material here..." id="matInput"></textarea>
      <button class="btn" onclick="upload()">Upload</button>
    </div>
    <div class="panel">
      <h2>Published Materials</h2>
      <div id="matList"><p class="empty">No materials yet. Upload something above.</p></div>
    </div>
  </div>
  <script>
    let materials = ['Introduction to Flask — slides week 1', 'Assignment 1: Build a REST API'];
    function render() {
      const el = document.getElementById('matList');
      if (!materials.length) { el.innerHTML = '<p class="empty">No materials yet.</p>'; return; }
      el.innerHTML = materials.map((m,i) => `<div class="material-item"><p>${m}</p><button class="del-btn" onclick="del(${i})">✕</button></div>`).join('');
    }
    function upload() { const v = document.getElementById('matInput').value.trim(); if (v) { materials.push(v); document.getElementById('matInput').value=''; render(); } }
    function del(i) { materials.splice(i,1); render(); }
    render();
  </script>
</body>
</html>
